<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحميل التطبيق</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      padding: 30px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .app-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #007bff, #0056b3);
      color: white;
      font-size: 32px;
      font-weight: bold;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
      box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #1a1a1a;
    }

    .version {
      font-size: 13px;
      color: #777;
      margin-bottom: 20px;
    }

    p.description {
      font-size: 15px;
      line-height: 1.6;
      color: #555;
      margin-bottom: 24px;
    }

    .features {
      text-align: right;
      background: #f9fbfb;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 25px;
      border: 1px solid #eef2f2;
    }

    .features h3 {
      font-size: 14px;
      margin-bottom: 10px;
      color: #333;
    }

    .features ul {
      list-style-type: none;
      font-size: 13px;
      color: #666;
    }

    .features li {
      margin-bottom: 6px;
      display: flex;
      align-items: center;
    }

    .features li::before {
      content: "✓";
      color: #28a745;
      margin-left: 8px;
      font-weight: bold;
    }

    .download-btn {
      display: block;
      width: 100%;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      transition: background-color 0.2s, transform 0.1s;
    }

    .download-btn:hover {
      background-color: #0056b3;
    }

    .download-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- أيقونة التطبيق أو شعاره -->
    <div class="app-icon">App</div>

    <!-- اسم التطبيق والإصدار -->
    <h1>اسم التطبيق هنا</h1>
    <div class="version">الإصدار 1.0.0 • الحجم: 15MB</div>

    <!-- نبذة عن التطبيق -->
    <p class="description">
      تطبيق مصمم لإدارة ومتابعة العمليات اليومية بكفاءة وسرعة، مع واجهة مستخدم سهلة ودعم للتحديثات المباشرة.
    </p>

    <!-- قائمة الميزات -->
    <div class="features">
      <h3>أبرز المميزات:</h3>
      <ul>
        <li>أداء سريع واستهلاك منخفض للموارد.</li>
        <li>واجهة تدعم اللغة العربية بالكامل.</li>
        <li>مزامنة وتنبيهات فورية.</li>
      </ul>
    </div>

    <!-- زر التحميل المباشر -->
    <!-- إذا كان الملف داخل نفس المستودع، ضع اسمه هنا مثل: app-release.apk -->
<a href="v2.3.apk" class="download-btn" download>

      تحميل ملف APK
    </a>
  </div>

</body>
</html>
